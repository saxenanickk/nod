[package]
name = "syntax"
version = "0.1.0"
edition = "2024"
description = "Tree-sitter syntax highlighting for diff lines. UI-free."

[dependencies]
# Pinned to match gpui-component's tree-sitter (native `links` allows one version).
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"
