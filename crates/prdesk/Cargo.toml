[package]
name = "prdesk"
version = "0.1.0"
edition = "2024"
description = "GPUI app: GitHub PR review companion for Zed."

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
github_types = { workspace = true }
github_client = { workspace = true }
diff_kit = { workspace = true }
repo_local = { workspace = true }
review_store = { workspace = true }
zed_bridge = { workspace = true }
syntax = { path = "../syntax" }
gpui = "0.2"
gpui-component = "0.5"
gpui-component-assets = "0.5"

# `cargo bundle --release` (needs `cargo install cargo-bundle`) packages a
# macOS .app from this metadata.
[package.metadata.bundle]
name = "prdesk"
identifier = "dev.saxenanickk.prdesk"
short_description = "GitHub PR review companion for Zed"
category = "public.app-category.developer-tools"
osx_minimum_system_version = "11.0"
